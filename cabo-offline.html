  setTimeout(cleanup, total + 600); // safety net
  return draw; // exposed for testing single frames
}
// Where a player's sticky hand comes from: their avatar, or the whole seat when the avatar is hidden (phones).
const avatarEl = (pid) => {
  const s = seats[pid];
  if (!s) return null;
  const av = s.head.querySelector('.avatar');
  return av && av.getBoundingClientRect().width ? av : s.el;
};

// Dashed glowing link between two swapped cards, with a ⇄ badge in the middle.
function swapLink(elA, elB, ms = 2600) {
  if (!elA || !elB) return;
  const [x1, y1] = center(elA), [x2, y2] = center(elB);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 60;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'swaplink');
  svg.innerHTML = `<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" /><circle cx="${x1}" cy="${y1}" r="7"/><circle cx="${x2}" cy="${y2}" r="7"/>`;
  document.body.appendChild(svg);
  const tag = document.createElement('div');
  tag.className = 'swaptag';
  tag.textContent = '⇄';
  tag.style.left = mx + 'px'; tag.style.top = (my + 30) + 'px';
  document.body.appendChild(tag);
  setTimeout(() => { svg.remove(); tag.remove(); }, ms);
}

// Full-screen CABO moment: burst rays, the word slams in, and who called it.
function caboCall(ev) {
  const who = ev.pid === V.you ? 'You' : nameOf(ev.pid);
  const d = document.createElement('div');
  d.className = 'cabocall';
  d.innerHTML = `<div class="rays"></div><div class="cc-inner"><div class="cc-word">CABO!</div>
    <div class="cc-who">${avatar(who, colorOf(ev.pid))}<span>${esc(who)} ${ev.auto ? 'ran out of cards!' : 'called it!'}</span></div>
    <div class="cc-sub">everyone else: 1 last turn</div></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
// A stamp that slams onto the middle of the table and fades: marks the start of a phase.
function splash(text, cls) {
  const host = $('.table3 .center');
  if (!host || document.hidden) return;
  host.querySelectorAll('.splash').forEach((e) => e.remove());
  const d = document.createElement('div');
  d.className = 'splash ' + cls;
  d.textContent = text;
  host.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}
// Opening deal: one card at a time from the draw pile, round the table starting on your left,
// four times over. Each spot stays empty until its card lands.
function dealFx() {
  const deck = $('#drawPile');
  const n = V.players.length, me = V.players.findIndex((p) => p.id === V.you);
  let k = 0;
  for (let i = 0; i < 4; i++) {
    for (let j = 1; j <= n; j++) {
      const p = V.players[(me + j) % n];
      const delay = 250 + k++ * 95;
      flyCard(deck, slotEl(p.id, i), null, { delay, ms: 460, arc: -36, spin: (Math.random() - 0.5) * 30 });
      setTimeout(() => sfx.deal(), delay);
    }
  }
  // the Peek button waits until every card is on the table
  const ms = 250 + k * 95 + 460;
  local.dealUntil = Date.now() + ms;
  setTimeout(() => V && V.status === 'INITIAL_VIEWING' && renderGame(), ms + 20);
}

// The draw pile ran out: the discards (all but the top card) slide over, get riffled together and
// squared up into a fresh draw pile. Later flights in the same update wait until it's done.
function reshuffleFx() {
  const from = $('#discardPile'), to = $('#drawPile');
  if (!from || !to || document.hidden) return;
  for (let i = 0; i < 7; i++) {
    flyCard(from, to, null, { delay: i * 70, ms: 420, arc: -30 - i * 4, spin: i % 2 ? 9 : -9 });
    if (i % 2 === 0) setTimeout(() => sfx.whoosh(), i * 70);
  }
  setTimeout(() => { pulse(to, 'shuffling', 900); [0, 90, 180, 270].forEach((t) => setTimeout(() => sfx.tap(), t + 120)); }, 6 * 70 + 420);
  fxHold = 6 * 70 + 420 + 800;
}

// An eye that peeps out from behind a card, looks left and right, blinks, and ducks back. Top-row
// cards have the name tag above them, so there it peeps out from under the card instead.
function peekEye(el, color, below = false) {
  if (!el || document.hidden) return;
  const r = el.getBoundingClientRect();
  const w = Math.max(34, r.width * 0.7);
  const d = document.createElement('div');
  d.className = 'peekeye' + (below ? ' below' : '');
  Object.assign(d.style, { left: r.left + r.width / 2 + 'px', top: (below ? r.bottom : r.top) + 'px', width: w + 'px' });
  if (color) d.style.setProperty('--iris', color);
  d.innerHTML = `<svg viewBox="-30 -21 60 40"><g class="lid">
      <path class="white" d="M-26 0 Q0 -22 26 0 Q0 22 -26 0Z"/>
      <g class="look"><circle class="iris" r="9"/><circle class="pupil" r="4.2"/><circle class="glint" cx="3" cy="-3.2" r="1.8"/></g>
      <path class="rim" d="M-26 0 Q0 -22 26 0 Q0 22 -26 0Z"/></g>
      <path class="lash" d="M-14 -11 L-17 -16 M0 -14 L0 -19 M14 -11 L17 -16"/></svg>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1900);
}
function shake() { const a = $('#app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }

// One clear signal per event: the animation itself carries most of the meaning, and words are added
// only when they say something you can't already see (e.g. someone took one of *your* cards).
function runFx(ev) {
  const mine = ev.pid === V.you;
  switch (ev.kind) {
    case 'turn':
      if (mine) { sfx.turn(); bigCall('YOUR TURN!', 'turn'); }
      break;
    case 'draw':
      sfx.draw();
      flyCard($('#drawPile'), $('#handzone .handcard'), mine ? V.hand : null, { ms: 750, arc: -60, spin: -12, flip: mine && V.hand ? 'up' : null });
      break;
    case 'swap': {
      // the replaced card flies face-up onto the pile, then the drawn card slides into its place
      sfx.whoosh();
      const el = slotEl(ev.a.owner, ev.a.idx);
      flyCard(el, $('#discardPile'), V.discardTop, { ms: 900, arc: -90, spin: 20, flip: 'up' });
      const drawn = mine && local.lastHand;
      flyCard($('#handzone .handcard'), el, drawn || null, { delay: 450, ms: 750, arc: 30, spin: -8, flip: drawn ? 'down' : null });
      if (el) setTimeout(() => pulse(el, 'swapped', 1400), 1250);
      break;
    }
    case 'discard': sfx.whoosh(); flyCard($('#handzone .handcard'), $('#discardPile'), V.discardTop, { ms: 800, arc: -40 }); break;
    case 'reveal':
      // 7–K go straight onto the pile face-up: the card landing there is the whole message
      sfx.whoosh();
      flyCard($('#drawPile'), $('#discardPile'), ev.card, { ms: 800, arc: -80, spin: -16, flip: 'up' });
      break;
    case 'power':
      // the purple mood and the caption ("J · Swap one of yours…") explain it; this marks the moment
      splash('POWER', 'power');
      if (mine) sfx.turn();
      break;
    case 'swapfx': {
      // Jack / King / Queen swaps: the two cards visibly cross the table into each other's places
      sfx.whoosh();
      setTimeout(() => sfx.whoosh(), 180);
      const ea = slotEl(ev.a.owner, ev.a.idx), eb = slotEl(ev.b.owner, ev.b.idx);
      if (ev.a.owner !== ev.b.owner) {
        // between two players: two sticky hands from the swapper each carry one card across
        stickyHand(avatarEl(ev.pid), ea, { via: eb });
        setTimeout(() => stickyHand(avatarEl(ev.pid), eb, { via: ea }), 140);
      } else {
        swapLink(ea, eb);
        flyCard(ea, eb, null, { delay: 250, ms: 1200, arc: -90, spin: 18 });
        flyCard(eb, ea, null, { delay: 250, ms: 1200, arc: 90, spin: -18 });
      }
      for (const el of [ea, eb]) if (el) pulse(el, 'swapped', 3000);
      // say it in words only when one of *your* cards moved — that's easy to miss and matters
      if (!mine && (ev.a.owner === V.you || ev.b.owner === V.you)) toast(`${nameOf(ev.pid)} swapped one of your cards`, 'bad');
      break;
    }
    case 'peek': {
      // looking at your own card (7/8): a little eye peeps over its top edge, glances, blinks and ducks
      // away. Someone else's card: the looker's sticky hand taps it.
      const el = slotEl(ev.a.owner, ev.a.idx);
      // the card being looked at lifts and tilts up, as if picked up, glowing in the looker's colour
      if (el) el.style.setProperty('--lift', colorOf(ev.pid));
      if (ev.a.owner !== ev.pid) {
        // 9 / 10 / Queen: the looker's sticky hand reaches over and lifts the card as it lands on it
        stickyHand(avatarEl(ev.pid), el);
        if (el) setTimeout(() => pulse(el, 'lifted', 1700), 340);
      } else if (el) {
        pulse(el, 'lifted', 1900);
        peekEye(el, colorOf(ev.pid), ev.a.idx < 2);
      }
      sfx.peek();
      break;
    }
    case 'match': {
      const el = slotEl(ev.owner, ev.idx);
      if (ev.owner !== ev.pid) stickyHand(avatarEl(ev.pid), el, { via: $('#discardPile'), card: ev.card });
      else flyCard(el, $('#discardPile'), ev.card, { ms: 800, arc: -60, flip: 'up' });
      floatText(mine ? 'MATCH!' : `${nameOf(ev.pid)} matched!`, el, 'good');
      sfx.match();
      if (!mine && ev.owner === V.you) toast(`${nameOf(ev.pid)} took one of your cards`, 'bad');
      break;
    }
    case 'give': {
      const el = slotEl(ev.to.owner, ev.to.idx);
      stickyHand(avatarEl(ev.pid), slotEl(ev.from.owner, ev.from.idx), { via: el });
      if (el) setTimeout(() => pulse(el, 'swapped', 1400), 1100);
      break;
    }
    case 'penalty': {
      if (ev.shown && ev.shown.owner !== ev.pid) stickyHand(avatarEl(ev.pid), slotEl(ev.shown.owner, ev.shown.idx), { miss: true });
      if (mine) {
        // the popup explains what happened; no extra floating labels on top of it
        shake(); sfx.buzz();
        penaltyPop(ev);
      } else {
        sfx.boop();
        if (ev.shown) setTimeout(() => { const el = slotEl(ev.shown.owner, ev.shown.idx); el && floatText('WRONG', el, 'bad'); }, ev.shown.owner !== ev.pid ? 450 : 0);
      }
      setTimeout(() => flyCard($('#drawPile'), slotEl(ev.pid, ev.idx), null, { ms: 900, arc: -60 }), 30);
      break;
    }
    case 'cabo':
      sfx.cabo(); caboCall(ev); shake();
      break;
    case 'reshuffle': reshuffleFx(); break;
    case 'window': sfx.open(); if (!V.open) splash('MATCH!', 'match'); break; // open window: the pile just glows
    case 'gameover': sfx.reveal(); break;
  }
}

function toast(msg, cls = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + cls;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4500);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}

// confetti
const cv = $('#fx');
const cx = cv.getContext('2d');
let parts = [];
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener('resize', resize); resize();
function confetti(x, y, n) {
  const cols = ['#ffd23f', '#ff4fa3', '#2ee6d6', '#9bf34a', '#ff8a3d', '#8b5cff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 8;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, r: 4 + Math.random() * 5, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 70 + Math.random() * 40 });
  }
}

// ---------------- frame loop: timers & expiries ----------------
let lastSig = '', lastSec = null;
function frame() {
  requestAnimationFrame(frame);
  if (parts.length) {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life-- > 0);
    for (const p of parts) {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30);
      cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore();
    }
    if (!parts.length) cx.clearRect(0, 0, innerWidth, innerHeight);
  }
  if (!V || V.status === 'LOBBY') return;
  const now = snow();
  // re-render when a peek expires or the matching window closes locally
  const sig = visiblePeeks().length + ':' + visibleReveals().length + ':' + (V.phase && V.phase.open && now < V.phase.deadline ? 1 : 0) +
    ':' + drawLocked() + ':' + !!(V.phase && V.phase.lateUntil && now < V.phase.lateUntil);
  if (sig !== lastSig) { lastSig = sig; renderGame(); }
  if (V.phase) {
    const rem = Math.max(0, V.phase.deadline - now);
    const secs = Math.ceil(rem / 1000);
    // countdown drains around the active player's seat border
    const total = 5000;
    for (const [pid, s] of Object.entries(seats)) {
      const on = pid === V.activeId && V.phase.open && rem > 0;
      s.el.classList.toggle('timing', on);
      if (on) {
        s.el.style.setProperty('--p', Math.min(1, rem / total).toFixed(3));
        s.el.style.setProperty('--tc', secs <= 1 ? 'var(--red)' : secs <= 2 ? 'var(--yellow)' : 'var(--lime)');
      }
    }
    if (secs !== lastSec) { if (lastSec !== null && secs > 0 && secs <= 3 && V.phase.open) sfx.tick(secs); lastSec = secs; }
  } else {
    lastSec = null;
    for (const s of Object.values(seats)) s.el.classList.remove('timing');
  }
}

// ---------------- sound (tiny WebAudio synth) ----------------
let AC = null;
function unlockAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } else if (AC.state === 'suspended') AC.resume(); }
function tone(f, d = .12, type = 'square', vol = .08, slide = 0, delay = 0) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  click: () => tone(660, .05, 'triangle', .05),
  tap: () => tone(880, .06, 'triangle', .07, 300),
  deal: () => tone(1500 + Math.random() * 300, .035, 'triangle', .035, -500),
  nope: () => tone(180, .12, 'sawtooth', .04),
  draw: () => tone(400, .12, 'triangle', .06, 400),
  whoosh: () => tone(900, .18, 'sine', .06, -700),
  peek: () => { tone(700, .08, 'sine', .06); tone(1050, .1, 'sine', .06, 0, .08); },
  open: () => tone(520, .1, 'square', .04, 200),
  tick: (s) => tone(s === 1 ? 1200 : 900, .07, 'square', .05),
  match: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .14, 'square', .06, 0, i * .07)),
  buzz: () => { tone(150, .3, 'sawtooth', .08, -60); tone(110, .3, 'square', .05, -40, .05); },
  boop: () => tone(240, .15, 'triangle', .05, -80),
  turn: () => [660, 880].forEach((f, i) => tone(f, .15, 'triangle', .08, 0, i * .1)),
  cabo: () => [392, 392, 523, 659].forEach((f, i) => tone(f, i === 3 ? .4 : .13, 'square', .08, 0, i * .12)),
  reveal: () => [300, 400, 500, 600, 800].forEach((f, i) => tone(f, .1, 'triangle', .06, 0, i * .06)),
  win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, .18, 'square', .07, 0, i * .12)),
  // tournament: a drumroll before the champion, a thump as someone lands on the podium
  drum: () => { for (let i = 0; i < 16; i++) tone(i % 2 ? 98 : 110, .06, 'triangle', .05 + i * .003, 0, i * .075); },
  land: () => tone(160, .14, 'sine', .08, -60),
  rise: () => tone(300, .35, 'triangle', .04, 500),
};

// Some browsers refuse URL changes on local files; the room code in the URL is only a convenience.
function setUrl(u) { try { history.replaceState(null, '', u); } catch {} }

if (window.CABO_OFFLINE) {
  // offline single-file build: no joining or invite links, just you vs bots
  document.body.classList.add('offline');
  local.homeStep = 'solo';
  save(null);
}
homeStory();
if (!session) show();
connect();
requestAnimationFrame(frame);

</script>
<script>
'use strict';
// "How to play": a mini table that plays itself, one idea at a time, for someone who has never
// played. Each step has a headline, a plain-language line, a highlight on the thing being talked
// about, and the game's own sounds. Previous / Pause / Next let people go at their own speed.
// Reuses the game's card, flight and sticky-hand animations from app.js.
(function () {
  const C = (id) => ({ id, rank: id.slice(0, -1), suit: id.slice(-1) });
  const STEPS = 10;
  let run = 0;        // bumping this cancels a running demo
  let paused = false; // Pause button
  let skip = false;   // Next button: finish the current step at once
  let cur = 0;        // the step on screen

  const slotHTML = (id, pen) => `<div class="slot${pen ? ' pen' : ''}"><div class="card"><div class="face back"></div><div class="face front">${id ? faceHTML(C(id)) : ''}</div></div></div>`;
  const seatHTML = (who, name, cards) => `<div class="d-seat d-${who}"><div class="d-name">${name}</div>
    <div class="d-row"><div class="d-grid">${cards.map((c) => slotHTML(c)).join('')}</div><div class="d-pen"></div></div></div>`;

  function stageHTML() {
    return `<div class="d-head"><div class="d-cap" id="dCap"></div><div class="d-sub" id="dSub"></div></div>
      <div class="d-table">
        ${seatHTML('top', 'Bo', ['KC', '7S', '2D', '9H'])}
        ${seatHTML('left', 'Ann', ['QD', '4S', 'KH', '8C'])}
        <div class="d-center"><div class="pile d-draw"><div class="face back"></div><div class="face back"></div></div><div class="pile d-discard"><div class="face"></div></div></div>
        ${seatHTML('right', 'Cat', ['3C', 'JS', '6D', '10H'])}
        <div class="d-me-wrap">${seatHTML('me', 'You', ['QS', 'KS', 'AH', '3D'])}<div class="d-hold"></div>
          <button class="cabo-hold d-cabo hidden" tabindex="-1"><span class="ring"></span><span class="ic">CABO</span></button></div>
        <div class="d-key hidden"></div>
        <div class="d-burst"><span>CABO!</span></div>
      </div>
      <div class="d-foot">
        <div class="d-nav">
          <button class="d-arrow" data-do="demoPrev" title="Previous step (← key)" aria-label="Previous step" disabled>←</button>
          <div class="d-dots">${'<span></span>'.repeat(STEPS)}</div>
          <button class="d-arrow" data-do="demoNext" title="Next step (→ key)" aria-label="Next step">→</button>
        </div>
        <div class="row">
          <button class="btn small white" data-do="demoPause">Pause</button>
          <button class="btn small white" data-do="demoReplay">Replay</button>
          <button class="btn small white" data-do="rulesText">Full rules</button>
        </div></div>`;
  }

  window.openDemo = function () {
    openModal('demo', '<div class="demo"></div>');
    play();
  };
  window.playDemo = () => play(0);
  window.demoCtl = {
    pause(b) { paused = !paused; if (b) b.textContent = paused ? 'Play' : 'Pause'; },
    next() { skip = true; paused = false; const b = document.querySelector('[data-do=demoPause]'); if (b) b.textContent = 'Pause'; },
    prev() { play(Math.max(0, cur - 1)); },
  };

  // Each step builds on the table the steps before it left, so going back replays the demo from the
  // top: steps before `from` run instantly and silently (no flights, sounds or waits), then it plays.
  async function play(from = 0) {
    const token = ++run;
    paused = false; skip = false;
    let fast = from > 0;
    const demo = document.querySelector('.demo');
    if (!demo) return;
    demo.innerHTML = stageHTML();
    const q = (s) => demo.querySelector(s);
    const alive = () => token === run && demo.isConnected;
    // waits that respect Pause, and end early when Next is pressed
    const wait = (ms) => (fast ? (alive() ? Promise.resolve() : Promise.reject('stop')) : new Promise((res, rej) => {
      let left = ms, last = performance.now();
      const tick = () => {
        if (!alive()) return rej('stop');
        const now = performance.now();
        if (!paused) left -= now - last;
        last = now;
        if (skip || left <= 0) return res();
        setTimeout(tick, 50);
      };
      tick();
    }));
    const later = (ms, fn) => (fast ? fn() : setTimeout(() => alive() && fn(), ms));
    const fly = (...a) => { if (!fast) flyCard(...a); };
    const hand = (...a) => { if (!fast) stickyHand(...a); };
    const seat = (who) => q('.d-' + who);
    const slot = (who, i) => seat(who).querySelectorAll('.d-grid .slot')[i];
    const avatar = (who) => seat(who).querySelector('.d-name');
    const pile = q('.d-discard'), deck = q('.d-draw'), hold = q('.d-hold');
    const setPile = (id) => { pile.innerHTML = `<div class="face front">${faceHTML(C(id))}</div>`; };
    const setFace = (el, id) => { el.querySelector('.front').innerHTML = faceHTML(C(id)); };
    const sound = (name) => { if (fast) return; try { sfx[name](); } catch {} };
    const say = (title, sub = '') => {
      const c = q('.d-cap'), d = q('.d-sub');
      c.textContent = title; d.textContent = sub;
      for (const el of [c, d]) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    };
    const sub = (text) => { const d = q('.d-sub'); d.textContent = text; d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); };
    // highlight what the words are about
    const focus = (...els) => { demo.querySelectorAll('.d-focus').forEach((e) => e.classList.remove('d-focus')); els.forEach((e) => e && e.classList.add('d-focus')); };
    const key = (html) => { const k = q('.d-key'); k.innerHTML = html || ''; k.classList.toggle('hidden', !html); };
    const step = (n) => {
      cur = n; skip = false;
      if (n >= from) fast = false;
      [...q('.d-dots').children].forEach((d, i) => d.classList.toggle('on', i <= n));
      q('[data-do=demoPrev]').disabled = n === 0;
    };

    try {
      // 1 — the table
      step(0);
      say('Welcome to CABO', '2 to 6 players. Everyone gets four cards, face down.');
      focus(seat('top'), seat('left'), seat('right'), seat('me'));
      await wait(4500);

      // 2 — the goal and card values
      step(1);
      say('Goal: the lowest total', 'Every card is worth points. At the end, the lowest total wins.');
      focus();
      key('<b>Card points</b><div>A = −1</div><div>2 to 10 = their number</div><div>J = 11 · Q = 12 · K = 13</div>');
      await wait(5500);
      key(null);

      // 3 — the one-time peek
      step(2);
      say('Peek at your bottom two', 'At the start you may look at these two cards, once.');
      focus(seat('me'));
      await wait(2000);
      sound('peek');
      slot('me', 2).classList.add('up', 'peek'); slot('me', 3).classList.add('up', 'peek');
      sub('An Ace (−1) and a 3. Remember them!');
      await wait(4000);
      slot('me', 2).classList.remove('up', 'peek'); slot('me', 3).classList.remove('up', 'peek');
      sub('Now they are face down again. The game is about memory.');
      await wait(3500);

      // 4 — drawing and swapping
      step(3);
      say('Your turn: draw a card', 'Take the top card from the deck.');
      focus(deck);
      deck.classList.add('tapme');
      await wait(2500);
      deck.classList.remove('tapme');
      sound('draw');
      hold.innerHTML = `<div class="face front">${faceHTML(C('5H'))}</div>`;
      fly(deck, hold, C('5H'), { ms: 900, arc: -50, spin: -10, flip: 'up' });
      focus(hold);
      sub('You drew a 5.');
      await wait(2500);
      say('Low cards go into your hand', 'Cards A to 6 must be swapped in. Swap out a card you think is high.');
      const target = slot('me', 1);
      focus(target);
      target.classList.add('sel');
      await wait(4000);
      target.classList.remove('sel');
      sound('whoosh');
      fly(target, pile, C('KS'), { ms: 1100, arc: -80, spin: 18, flip: 'up' });
      setPile('KS');
      fly(hold, target, null, { delay: 500, ms: 900, arc: 30, spin: -8 });
      setFace(target, '5H');
      later(500, () => { hold.innerHTML = ''; });
      sub('It was a King (13 points). It goes face up on the pile.');
      later(1200, () => focus(pile));
      await wait(4500);

      // 5 — matching
      step(4);
      say('Matching', 'When a card lands on the pile, anyone can throw in a card with the same number.');
      focus(pile);
      await wait(5000);
      sub('Ann remembers that Bo has a King…');
      focus(slot('top', 0), avatar('left'));
      await wait(2500);
      hand(avatar('left'), slot('top', 0), { via: pile, card: C('KC'), color: '#2ee6d6' });
      setPile('KC');
      later(500, () => slot('top', 0).classList.add('empty'));
      later(1050, () => sound('match'));
      later(1100, () => focus(pile));
      await wait(1600);
      sub('Match! Ann grabbed it, so that King is gone.');
      await wait(3500);

      // 6 — giving a card back
      step(5);
      say('Took someone else\'s card?', 'Then you give them one of yours, so they still have four.');
      focus(seat('left'), seat('top'));
      await wait(2500);
      sound('whoosh');
      hand(avatar('left'), slot('left', 1), { via: slot('top', 0), color: '#2ee6d6' });
      later(450, () => slot('left', 1).classList.add('empty'));
      later(1000, () => slot('top', 0).classList.remove('empty'));
      await wait(3500);
      sub('Ann now has one card less. Fewer cards usually means fewer points.');
      await wait(3500);

      // 7 — wrong guesses
      step(6);
      say('Careful: wrong guesses cost you', 'Cat taps a card that is not a King…');
      focus(seat('right'));
      await wait(2500);
      hand(avatar('right'), slot('top', 1), { miss: true, color: '#9bf34a' });
      later(380, () => { slot('top', 1).classList.add('up', 'revealed'); sound('buzz'); focus(slot('top', 1)); });
      await wait(2000);
      sub('It was a 7, and now everyone has seen it.');
      await wait(3000);
      sub('Cat also takes an extra penalty card. It adds to Cat\'s score.');
      const pen = document.createElement('div');
      pen.innerHTML = slotHTML(null, true);
      const penSlot = pen.firstChild;
      seat('right').querySelector('.d-pen').appendChild(penSlot);
      sound('boop');
      fly(deck, penSlot, null, { ms: 1000, arc: -60 });
      focus(penSlot);
      await wait(4000);
      slot('top', 1).classList.remove('up', 'revealed');

      // 8 — power cards
      step(7);
      say('High cards have powers', 'Cards 7 to K go straight onto the pile. Then you use their power.');
      focus(deck, pile);
      sound('whoosh');
      fly(deck, pile, C('9D'), { ms: 1000, arc: -80, spin: -14, flip: 'up' });
      setPile('9D');
      await wait(4500);
      key('<b>Powers</b><div>7, 8 — look at one of your cards</div><div>9, 10 — look at someone else\'s card</div><div>J — swap one of yours with any card</div><div>Q — look at a card, then maybe swap it</div><div>K — swap two other players\' cards</div>');
      focus();
      sub('Here is what each one does.');
      await wait(6000);
      key(null);
      sub('Bo drew this 9, so Bo looks at one of your cards. Only Bo sees it.');
      focus(slot('me', 0));
      await wait(2000);
      hand(avatar('top'), slot('me', 0), { color: '#ff86c2' });
      later(380, () => { slot('me', 0).classList.add('flash'); sound('peek'); });
      await wait(3500);
      slot('me', 0).classList.remove('flash');

      // 9 — calling CABO
      step(8);
      say('Think you have the lowest total?', 'At the start of your turn, press and hold CABO.');
      const cabo = q('.d-cabo');
      cabo.classList.remove('hidden');
      focus(cabo);
      await wait(3000);
      cabo.classList.add('holding');
      await wait(1200);
      cabo.classList.remove('holding');
      cabo.classList.add('hidden');
      sound('cabo');
      q('.d-burst').classList.add('show');
      await wait(2000);
      q('.d-burst').classList.remove('show');
      sub('Everyone else gets one last turn, then the round ends.');
      focus();
      await wait(4000);

      // 10 — scoring
      step(9);
      say('Then everyone shows their cards', 'Add up the points. The lowest total wins.');
      focus(seat('me'));
      sound('reveal');
      for (let i = 0; i < 4; i++) later(i * 250, () => slot('me', i).classList.add('up'));
      await wait(1500);
      const total = document.createElement('div');
      total.className = 'd-total';
      total.textContent = '12 + 5 − 1 + 3 = 19';
      seat('me').appendChild(total);
      await wait(4500);
      say('That\'s the game!', 'Remember cards, match fast, and call CABO at the right moment.');
      sound('win');
      focus();
      q('[data-do=demoReplay]').classList.add('pink');
    } catch (e) {
      if (e !== 'stop') console.error(e);
    }
  }
})();

</script>
</body>
</html>
